# Built-in CLIP zero-shot vocabulary for `photo tag auto --clip`.
# tag path -> prompt phrase(s). Every phrase is wrapped in `template` and the phrase embeddings of a tag are
# averaged. Edit freely (or point PHOTOSTUDIO_TAG_VOCAB at your own file): tags are plain `a|b|c` paths.
# Thresholds are starting points, not sourced: tune min_prob on your own library.
version: 1
template: "a photo of {}"
min_prob: 0.10          # softmax probability (logit scale 100) needed to emit a tag
max_tags: 6             # per image
exclusive: [genre, time_of_day, weather, shot_type]   # groups where only the best tag is kept
groups:
  genre:
    "genre|portrait": ["a portrait of a person", "a close-up of a person's face"]
    "genre|landscape": ["a landscape", "a scenic landscape with sky"]
    "genre|street": ["street photography in a city", "people walking on a city street"]
    "genre|wildlife": ["wildlife in nature", "a wild animal"]
    "genre|macro": ["a macro close-up of a small subject", "an extreme close-up of an insect or flower"]
    "genre|night": ["a night scene", "a city at night with lights"]
    "genre|astro": ["the milky way", "stars in the night sky"]
    "genre|architecture": ["architecture", "a building exterior"]
    "genre|product": ["a product on a plain background", "a still life object"]
    "genre|food": ["food on a plate", "a meal on a table"]
    "genre|sports": ["a sports action shot", "an athlete in motion"]
    "genre|event": ["people at a party or celebration", "a group of people at an event"]
    "genre|abstract": ["an abstract pattern", "abstract shapes and colors"]
  time_of_day:
    "light|sunrise": "a sunrise"
    "light|sunset": "a sunset"
    "light|golden-hour": "warm golden hour light"
    "light|blue-hour": "blue hour twilight"
    "light|midday": "harsh midday sun"
    "light|overcast": "an overcast day with soft light"
    "light|night": "a dark night scene"
  weather:
    "weather|clear": "a clear blue sky"
    "weather|cloudy": "a cloudy sky"
    "weather|storm": "a storm with dark clouds"
    "weather|rain": "rain"
    "weather|fog": "fog and mist"
    "weather|snow": "snow"
    "weather|rainbow": "a rainbow"
    "weather|lightning": "lightning"
  shot_type:

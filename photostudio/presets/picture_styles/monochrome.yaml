name: monochrome
kind: picture_style
title: Canon Monochrome (approximation)
description: >
  APPROXIMATION of the camera's Picture Style, built from Canon's public descriptions (not Canon's actual curves, which are not published). Sharpness maps at about 0.1 sharpen-amount per Canon step (0-7). For a faithful match run: photo calibrate picture-style --dir <folder with CR3+JPEG pairs> --style NAME, which fits a tone curve and 3x3 matrix from your own camera/JPEG pairs. Monochrome: sharpness 3, medium contrast, optional filter effect (none/yellow/orange/red/green) and toning
  (none/sepia/blue/purple/green). Here: monochrome (neutral filter by default), luma S-curve, sharpen 0.30.
  Variants: yellow, orange, red, green (filter effects) and sepia (toning via split_tone).
tags: [canon, picture-style, approximation, bw]
stack:
  - {op: monochrome, params: {filter: neutral}}
  - {op: tone_curve, params: {mode: luma, points: [[0.0, 0.0], [0.25, 0.23], [0.5, 0.5], [0.75, 0.77], [1.0, 1.0]]}}
  - {op: sharpen, params: {amount: 0.30, radius: 1.0, masking: 0.2}}
variants:
  yellow: {stack: [{op: monochrome, params: {filter: yellow}}]}
  orange: {stack: [{op: monochrome, params: {filter: orange}}]}
  red: {stack: [{op: monochrome, params: {filter: red}}]}
  green: {stack: [{op: monochrome, params: {filter: green}}]}
  sepia:
    stack:
      - {op: split_tone, params: {shadow_hue: 35, shadow_sat: 0.25, highlight_hue: 45, highlight_sat: 0.20, balance: 0.0}}

name: faithful
kind: picture_style
title: Canon Faithful (approximation)
description: >
  APPROXIMATION of the camera's Picture Style, built from Canon's public descriptions (not Canon's actual curves, which are not published). Sharpness maps at about 0.1 sharpen-amount per Canon step (0-7). For a faithful match run: photo calibrate picture-style --dir <folder with CR3+JPEG pairs> --style NAME, which fits a tone curve and 3x3 matrix from your own camera/JPEG pairs. Faithful: colorimetric rendering referenced to 5200 K daylight, no sharpening. Here: saturation -2 only and no
  tone curve (the engine's default tone map already gives a neutral rendering); WB should be set to about 5200 K
  daylight for the closest match.
tags: [canon, picture-style, approximation, colorimetric]
stack:
  - {op: saturation, params: {amount: -2}}

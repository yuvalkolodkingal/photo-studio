name: landscape
kind: picture_style
title: Canon Landscape (approximation)
description: >
  APPROXIMATION of the camera's Picture Style, built from Canon's public descriptions (not Canon's actual curves, which are not published). Sharpness maps at about 0.1 sharpen-amount per Canon step (0-7). For a faithful match run: photo calibrate picture-style --dir <folder with CR3+JPEG pairs> --style NAME, which fits a tone curve and 3x3 matrix from your own camera/JPEG pairs. Landscape: sharpness 4, deep vivid blues and greens, crisp outlines. Here: saturation +10, blue and green
  saturation +8 / luminance -4, luma S-curve (strength about 0.025), sharpen 0.40 radius 0.9.
tags: [canon, picture-style, approximation, vivid]
stack:
  - {op: saturation, params: {amount: 10}}
  - {op: hsl_mixer, params: {blue_sat: 8, blue_lum: -4, green_sat: 8, green_lum: -4, aqua_sat: 5}}
  - {op: tone_curve, params: {mode: luma, points: [[0.0, 0.0], [0.25, 0.225], [0.5, 0.5], [0.75, 0.775], [1.0, 1.0]]}}
  - {op: sharpen, params: {amount: 0.40, radius: 0.9, masking: 0.2}}

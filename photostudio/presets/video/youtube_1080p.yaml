name: youtube_1080p
kind: video
title: YouTube 1080p (H.264 High, BT.709, fast-start)
description: >
  YouTube's recommended upload encode: MP4 with the moov atom first, H.264 High profile, CABAC, 2 B-frames,
  closed GOP of half the frame rate, 4:2:0, BT.709 tags, AAC-LC 48 kHz. CRF 18 (visually lossless at
  YouTube's 8 Mbps reference for 24-30 fps / 12 Mbps for 48-60 fps). Never upscales; audio is passed through when it is AAC.
tags: [youtube, h264, sdr, delivery]
stack: []
options:
  container: mp4
  size: {max_height: 1080}
  hdr: tonemap
  video:
    codec: h264
    encoder: libx264
    preset: slow
    crf: 18
    profile: high
    pix_fmt: yuv420p
    gop: half_fps
    bframes: 2
  audio: {mode: auto, codec: aac, bitrate: 384k, rate: 48000, channels: 2}
  movflags: +faststart
  guidance:
    source: https://support.google.com/youtube/answer/1722171
    recommended_bitrate_mbps: {"24-30 fps": 8, "48-60 fps": 12}
variants:
  hevc:
    options:
      video: {codec: hevc, encoder: libx265, preset: medium, crf: 22, pix_fmt: yuv420p10le, gop: half_fps, bframes: 2, tag: hvc1}
  hq:
    options:
      video: {codec: h264, encoder: libx264, preset: slower, crf: 16, profile: high, pix_fmt: yuv420p, gop: half_fps, bframes: 2}

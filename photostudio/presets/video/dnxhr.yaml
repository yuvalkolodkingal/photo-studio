name: dnxhr
kind: video
title: DNxHR HQX intermediate (10-bit 4:2:2)
description: >
  Avid DNxHR HQX in a MOV (10-bit 4:2:2, resolution independent) with PCM audio, for editors that prefer DNx over ProRes.
  Variants: hq (8-bit), sq, lb for lighter proxies.
tags: [intermediate, dnxhr, 10bit]
